[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noezema"
version = "0.0.0"
description = "Local-first autonomous thinker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "NOEZEMA contributors" },
]
dependencies = [
  "alembic>=1.15,<2",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "model_compatibility: opt-in checks against a real local LLM backend",
  "postgresql_integration: opt-in checks against a disposable PostgreSQL database",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
