# Open lab profile — заготовка (M2 T2.2).
# Расширенный экспериментальный режим: пока НЕ включается по умолчанию;
# включение требует отдельного operator command (M7) и остаётся под
# теми же hard-лимитами ресурсов.
version: v1
name: open_lab
network: none               # до M6 сеть запрещена во всех профилях
read_only_rootfs: true
capabilities: []
no_new_privileges: true
seccomp: default
resource_limits:
  cpu: "2.0"
  memory_mb: 1024
  max_processes: 64
  timeout_seconds: 300
  max_file_size_mb: 200
tools:
  workspace.read: true
  workspace.list: true
  workspace.write: true
  python.execute: true
  shell.execute: true
  memory.search: true
  question.create: true
  message.reply: true
  artifact.create: true
  research.fetch: false
paths:
  writable: ["/workspace"]
  readable: ["/base", "/workspace"]
secrets: deny
metadata_endpoints: deny
