name: CI

# T7.55: runners pinned to ubuntu-24.04 (ubuntu-latest migrates to Ubuntu 26 in a rollout from
# 2026-10-19 to 2026-11-19 — GitHub changelog 2026-09-17); actions/checkout@v5 and
# actions/setup-python@v6 are the Node 24 majors (checkout v5: "Updated to the node24 runtime",
# requires runner >= v2.327.1; setup-python v6: "Upgraded action from node20 to node24").

on:
  push:
    branches: [main, develop, impl/from-scratch]
  pull_request:
    branches: [main, impl/from-scratch]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade uv
      - run: uv pip install --system ".[dev]"
      - name: ruff
        run: ruff check .

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade uv
      - run: uv pip install --system ".[dev]"
      - name: mypy
        run: mypy packages apps hostctl

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: noezema
          POSTGRES_USER: noezema
          POSTGRES_PASSWORD: noezema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NOEZEMA_TEST_DATABASE_URL: postgresql+asyncpg://noezema:noezema_dev@localhost:5432/noezema
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade uv
      - run: uv pip install --system ".[dev]"
      # Build the sandbox image BEFORE pytest (AGENTS.md §6, T7.54): under xdist every
      # worker is a separate process, so the `sandbox_image` fixture only verifies that
      # the pre-built tag exists (T7.41) — without this step it fails closed.
      - name: Build sandbox image
        run: docker image inspect noezema-sandbox:test >/dev/null 2>&1 || docker build -f sandbox/Containerfile -t noezema-sandbox:test sandbox/
      - name: Run tests
        # T7.55: xdist parallel — ubuntu-24.04 hosted runner has 4 vCPU; the sandbox image is built
        # in the step above (one tag for all workers, T7.41/T7.54) and scratch DBs are cloned from
        # per-worker session templates (one alembic run per worker, T7.55).
        run: python -m pytest -v --tb=short -n auto

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build dev image
        run: docker build -f Dockerfile -t noezema-dev:ci .
