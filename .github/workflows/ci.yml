name: CI

on:
  push:
    branches: [main, branch-qwen3.6-27b, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: noezema
          POSTGRES_USER: noezema
          POSTGRES_PASSWORD: noezema_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        run: pip install --upgrade uv
      - name: Install dependencies
        run: uv pip install --system ".[dev]" aiosqlite
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
