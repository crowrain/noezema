name: CI

on:
  push:
    branches:
      - main
      - codex-main-1
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Run validation suite
        run: python scripts/check.py

  systemd:
    name: Verify systemd units
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare verification-only host paths and principals
        run: |
          sudo groupadd --system noezema-observer
          sudo useradd --system --user-group --home /nonexistent --shell /usr/sbin/nologin noezema
          sudo useradd --system --home /nonexistent --shell /usr/sbin/nologin --gid noezema-observer noezema-web
          sudo install -d /opt/noezema/.venv/bin /etc/noezema
          sudo install -m 0755 /bin/true /opt/noezema/.venv/bin/python
          sudo install -m 0755 /bin/true /opt/noezema/.venv/bin/uvicorn
          sudo touch /etc/noezema/noezema-runtime.env /etc/noezema/noezema-web.env

      - name: Verify supervision graph
        run: systemd-analyze verify infra/systemd/*.service infra/systemd/*.target infra/systemd/*.timer
