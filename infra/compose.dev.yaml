# Local development stack (M0, T0.5). PostgreSQL 15 + deterministic fake LLM.
# No Redis in v1 (ADR-0003).
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: noezema
      POSTGRES_USER: noezema
      POSTGRES_PASSWORD: noezema_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noezema"]
      interval: 5s
      timeout: 3s
      retries: 5

  fake-llm:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "tests.fakes.fake_openai_server", "--host", "0.0.0.0", "--port", "8089"]
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/v1/models')\""]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
