services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: noezema
      POSTGRES_USER: noezema
      POSTGRES_PASSWORD: noezema_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noezema"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  alembic:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://noezema:noezema_dev@db:5432/noezema
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["uvicorn", "apps.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://noezema:noezema_dev@db:5432/noezema
      REDIS_URL: redis://redis:6379/0
      NOEZEMA_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "apps.rq.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://noezema:noezema_dev@db:5432/noezema
      REDIS_URL: redis://redis:6379/0
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-27b}
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./workspace:/app/workspace

  # Alternative: orchestrator standalone loop (no Redis needed)
  orchestrator:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "apps.orchestrator.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://noezema:noezema_dev@db:5432/noezema
      NOEZEMA_ENV: prod
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-27b}
    depends_on:
      alembic:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./workspace:/app/workspace

volumes:
  pgdata:
  redisdata:
