<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noezema — Cognitive Monitor</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #c9d1d9;
            --muted: #8b949e;
            --border: #30363d;
            --accent: #58a6ff;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --card-bg: #161b22;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--fg);
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        h1 { font-size: 1.4rem; font-weight: 600; }
        .status { font-size: 0.85rem; color: var(--muted); }
        .status .dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .dot.green { background: var(--success); }
        .dot.yellow { background: var(--warning); }
        .dot.red { background: var(--danger); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
        }
        .card h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }
        .card .value { font-size: 1.8rem; font-weight: 700; }
        .card .sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
        .section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .section h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th, td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-green { background: rgba(63,185,80,0.15); color: var(--success); }
        .badge-yellow { background: rgba(210,153,34,0.15); color: var(--warning); }
        .badge-blue { background: rgba(88,166,255,0.15); color: var(--accent); }
        .badge-red { background: rgba(248,81,73,0.15); color: var(--danger); }
        .grade-a { color: var(--success); }
        .grade-b { color: var(--warning); }
        .grade-c, .grade-d, .grade-e { color: var(--danger); }
        .uuid { font-family: 'SF Mono', Monaco, monospace; font-size: 0.75rem; color: var(--muted); }
        .truncate { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn:hover { opacity: 0.85; }
        .refresh { float: right; }
        #loading { text-align: center; padding: 40px; color: var(--muted); display: none; }
    </style>
</head>
<body>
    <header>
        <h1>◉ Noezema</h1>
        <div class="status">
            <span class="dot green" id="statusDot"></span>
            <span id="statusText">Connected</span>
        </div>
    </header>

    <div class="grid" id="stats">
        <div class="card">
            <h3>Sessions</h3>
            <div class="value" id="statSessions">—</div>
            <div class="sub" id="statSessionsSub">total</div>
        </div>
        <div class="card">
            <h3>Claims</h3>
            <div class="value" id="statClaims">—</div>
            <div class="sub" id="statClaimsSub">assessed</div>
        </div>
        <div class="card">
            <h3>Questions</h3>
            <div class="value" id="statQuestions">—</div>
            <div class="sub" id="statQuestionsSub">queued</div>
        </div>
        <div class="card">
            <h3>Evidence</h3>
            <div class="value" id="statEvidence">—</div>
            <div class="sub" id="statEvidenceSub">total</div>
        </div>
    </div>

    <div class="section">
        <h2>Timeline <button class="btn refresh" onclick="loadTimeline()">↻</button></h2>
        <table>
            <thead><tr><th>Time</th><th>Event</th><th>Session</th><th>Details</th></tr></thead>
            <tbody id="timelineBody"><tr><td colspan="4" style="color:var(--muted)">Loading...</td></tr></tbody>
        </table>
    </div>

    <div class="section">
        <h2>Recent Claims <button class="btn refresh" onclick="loadClaims()">↻</button></h2>
        <table>
            <thead><tr><th>Grade</th><th>Statement</th><th>Type</th><th>Evidence</th><th>Session</th></tr></thead>
            <tbody id="claimsBody"><tr><td colspan="5" style="color:var(--muted)">Loading...</td></tr></tbody>
        </table>
    </div>

    <div class="section">
        <h2>Sessions <button class="btn refresh" onclick="loadSessions()">↻</button></h2>
        <table>
            <thead><tr><th>ID</th><th>State</th><th>Question</th><th>Actions</th></tr></thead>
            <tbody id="sessionsBody"><tr><td colspan="4" style="color:var(--muted)">Loading...</td></tr></tbody>
        </table>
    </div>

<script>
const API = '/api';

async function json(url) {
    const r = await fetch(API + url);
    if (!r.ok) throw new Error(`${r.status} ${url}`);
    return r.json();
}

function shortId(id) { return id ? id.slice(0, 8) + '…' : '—'; }
function gradeClass(g) { return `grade-${g ? g.toLowerCase() : ''}`; }

async function loadStats() {
    try {
        const data = await json('/status');
        document.getElementById('statSessions').textContent = data.sessions || 0;
        document.getElementById('statClaims').textContent = data.claims || 0;
        document.getElementById('statQuestions').textContent = data.questions || 0;
        document.getElementById('statEvidence').textContent = data.evidence || 0;
        document.getElementById('statSessionsSub').textContent = `${data.sessions || 0} total`;
        document.getElementById('statusDot').className = 'dot green';
        document.getElementById('statusText').textContent = 'Connected';
    } catch (e) {
        document.getElementById('statusDot').className = 'dot red';
        document.getElementById('statusText').textContent = 'Disconnected';
    }
}

async function loadTimeline() {
    try {
        const events = await json('/timeline?limit=20');
        const tbody = document.getElementById('timelineBody');
        if (!events.length) { tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">No events yet</td></tr>'; return; }
        tbody.innerHTML = events.map(e => `<tr>
            <td>${e.timestamp || ''}</td>
            <td><span class="badge badge-blue">${e.event_type}</span></td>
            <td class="uuid">${shortId(e.session_id)}</td>
            <td class="truncate">${e.payload || ''}</td>
        </tr>`).join('');
    } catch (e) {
        document.getElementById('timelineBody').innerHTML = `<tr><td colspan="4" style="color:var(--danger)">${e.message}</td></tr>`;
    }
}

async function loadClaims() {
    try {
        const claims = await json('/claims?limit=15');
        const tbody = document.getElementById('claimsBody');
        if (!claims.length) { tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">No claims yet</td></tr>'; return; }
        tbody.innerHTML = claims.map(c => `<tr>
            <td class="${gradeClass(c.effective_grade)}" style="font-weight:700">${c.effective_grade || '—'}</td>
            <td class="truncate" title="${c.statement}">${c.statement}</td>
            <td><span class="badge badge-yellow">${c.claim_type || ''}</span></td>
            <td>${c.evidence_count || 0}</td>
            <td class="uuid">${shortId(c.session_id)}</td>
        </tr>`).join('');
    } catch (e) {
        document.getElementById('claimsBody').innerHTML = `<tr><td colspan="5" style="color:var(--danger)">${e.message}</td></tr>`;
    }
}

async function loadSessions() {
    try {
        const sessions = await json('/sessions?limit=15');
        const tbody = document.getElementById('sessionsBody');
        if (!sessions.length) { tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">No sessions yet</td></tr>'; return; }
        tbody.innerHTML = sessions.map(s => `<tr>
            <td class="uuid">${shortId(s.id)}</td>
            <td><span class="badge ${s.state === 'succeeded' ? 'badge-green' : s.state === 'failed' ? 'badge-red' : 'badge-blue'}">${s.state}</span></td>
            <td class="truncate">${s.question_statement || '—'}</td>
            <td>${s.action_count || 0}</td>
        </tr>`).join('');
    } catch (e) {
        document.getElementById('sessionsBody').innerHTML = `<tr><td colspan="4" style="color:var(--danger)">${e.message}</td></tr>`;
    }
}

// Auto-refresh every 10s
async function init() {
    await loadStats();
    await loadTimeline();
    await loadClaims();
    await loadSessions();
}

init();
setInterval(init, 10000);
</script>
</body>
</html>
